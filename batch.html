<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#090b10">
<title>Batch — CODEX STUDYS</title>
<link rel="icon" href="assets/selectionway-icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/selectionway-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){var t=localStorage.getItem("codex-studys-theme");if(t&&t!=="system")document.documentElement.setAttribute("data-theme",t);})();</script>
<style>
    :root {
      --bg: #080a0f;
      --bg-raised: #0d1017;
      --panel: rgba(17, 21, 31, .82);
      --panel-solid: #11151f;
      --panel-soft: #151b27;
      --line: rgba(255, 255, 255, .09);
      --line-strong: rgba(255, 255, 255, .16);
      --text: #f4f6fb;
      --muted: #8d96a8;
      --muted-bright: #b4bdcd;
      --brand: #8b7cff;
      --brand-bright: #a69cff;
      --mint: #55ddbb;
      --orange: #ffb36b;
      --danger: #ff7585;
      --shadow: 0 24px 70px rgba(0, 0, 0, .32);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 11px;
      --max: 1240px;
    }

    html[data-theme="light"] {
      --bg: #f4f5f9; --bg-raised: #ffffff; --panel: rgba(255,255,255,.86); --panel-solid: #ffffff; --panel-soft: #eef0f6;
      --line: rgba(20,22,35,.1); --line-strong: rgba(20,22,35,.18); --text: #14161f; --muted: #5b6072; --muted-bright: #383c4a;
      --brand: #6c5ce7; --brand-bright: #5b46e0; --mint: #12b899; --orange: #d9832a; --danger: #e0344f;
      --shadow: 0 24px 70px rgba(30,30,60,.14);
    }
    html[data-theme="sandalwood"] {
      --bg: #1c130c; --bg-raised: #241a10; --panel: rgba(43,31,20,.82); --panel-solid: #2b1f14; --panel-soft: #332417;
      --line: rgba(255,225,190,.1); --line-strong: rgba(255,225,190,.18); --text: #f6ead9; --muted: #b89a7c; --muted-bright: #d9c1a3;
      --brand: #cd8a4a; --brand-bright: #e6a75f; --mint: #b58a4f; --orange: #ff9d4d; --danger: #ff7c6b;
    }
    html[data-theme="forest-emerald"] {
      --bg: #06140f; --bg-raised: #0a1c15; --panel: rgba(12,32,24,.82); --panel-solid: #0e2318; --panel-soft: #122a1d;
      --line: rgba(180,255,220,.09); --line-strong: rgba(180,255,220,.17); --text: #eafff3; --muted: #83b39c; --muted-bright: #aed7c1;
      --brand: #2fbf7a; --brand-bright: #3fdd91; --mint: #55ddbb; --orange: #ffb36b; --danger: #ff7585;
    }
    html[data-theme="ocean-deep"] {
      --bg: #050e17; --bg-raised: #081521; --panel: rgba(11,26,40,.82); --panel-solid: #0c1e2e; --panel-soft: #102636;
      --line: rgba(170,225,255,.09); --line-strong: rgba(170,225,255,.17); --text: #eaf6ff; --muted: #7ea3bd; --muted-bright: #a9cbe0;
      --brand: #2196e0; --brand-bright: #4db4ff; --mint: #2fd3c7; --orange: #ffb36b; --danger: #ff7585;
    }
    html[data-theme="sakura-blossom"] {
      --bg: #fff3f6; --bg-raised: #ffffff; --panel: rgba(255,255,255,.88); --panel-solid: #ffffff; --panel-soft: #ffe4ec;
      --line: rgba(180,40,80,.1); --line-strong: rgba(180,40,80,.18); --text: #3c1420; --muted: #a26478; --muted-bright: #7a3a4c;
      --brand: #ec6f96; --brand-bright: #e14f7e; --mint: #16b39a; --orange: #e08a3c; --danger: #d9314f;
    }
    html[data-theme="dracula-midnight"] {
      --bg: #14121f; --bg-raised: #1b1830; --panel: rgba(38,33,64,.82); --panel-solid: #241f3d; --panel-soft: #2b2549;
      --line: rgba(220,200,255,.09); --line-strong: rgba(220,200,255,.17); --text: #f3ecff; --muted: #a08fc9; --muted-bright: #c6b7ea;
      --brand: #bd93f9; --brand-bright: #d6acff; --mint: #50fa7b; --orange: #ffb86c; --danger: #ff5555;
    }
    html[data-theme="lavender-mist"] {
      --bg: #f5f2fc; --bg-raised: #ffffff; --panel: rgba(255,255,255,.88); --panel-solid: #ffffff; --panel-soft: #ece5fb;
      --line: rgba(80,50,140,.1); --line-strong: rgba(80,50,140,.18); --text: #2c2140; --muted: #7a6a9c; --muted-bright: #4d3d70;
      --brand: #9b7be0; --brand-bright: #855fdb; --mint: #16b39a; --orange: #d9832a; --danger: #d9314f;
    }
    html[data-theme="cyberpunk-neon"] {
      --bg: #05020a; --bg-raised: #0a0512; --panel: rgba(20,8,32,.85); --panel-solid: #150a22; --panel-soft: #1c0e2c;
      --line: rgba(255,60,220,.16); --line-strong: rgba(255,60,220,.3); --text: #f2e9ff; --muted: #b48ad9; --muted-bright: #e2b8ff;
      --brand: #ff2ec4; --brand-bright: #ff5be0; --mint: #2af5ff; --orange: #ffb36b; --danger: #ff3860;
    }
* { box-sizing: border-box; }
body { margin:0; min-width:320px; background: radial-gradient(circle at 78% 3%, rgba(139,124,255,.12), transparent 30rem), var(--bg); color:var(--text); font:15px/1.55 "DM Sans", sans-serif; -webkit-font-smoothing:antialiased; }
h1,h2,h3 { font-family:"Space Grotesk","DM Sans",sans-serif; margin:0; }
button { font:inherit; color:inherit; cursor:pointer; }
.topbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--panel); backdrop-filter:blur(16px); border-bottom:1px solid var(--line); }
.icon-btn { width:38px; height:38px; display:grid; place-items:center; border-radius:12px; border:1px solid var(--line); background:var(--panel-soft); }
.icon-btn svg { width:18px; height:18px; }
.topbar h2 { font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wrap { max-width:860px; margin:0 auto; padding:16px; }
.hero { border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden; background:var(--panel); box-shadow:var(--shadow); }
.hero img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:var(--panel-soft); }
.hero-body { padding:16px; }
.hero-body h1 { font-size:20px; line-height:1.3; }
.hero-body p { margin:6px 0 0; color:var(--muted-bright); font-size:13px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.chip { padding:3px 10px; border-radius:999px; border:1px solid var(--line); color:var(--muted-bright); background:rgba(255,255,255,.03); font-size:11px; font-weight:700; }
.chip-accent { color:var(--brand-bright); border-color:rgba(139,124,255,.35); background:rgba(139,124,255,.1); }
.chip-live { color:var(--danger); border-color:rgba(255,117,133,.4); background:rgba(255,117,133,.1); }
.tabs { display:flex; gap:8px; margin:16px 0 12px; }
.tab { flex:1; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--panel); color:var(--muted-bright); font-weight:700; font-size:13px; }
.tab.active { color:#fff; border-color:transparent; background:linear-gradient(135deg,#9487ff,#6c5bed); box-shadow:0 10px 24px rgba(109,91,237,.24); }
.panel { display:none; } .panel.active { display:block; }
.row { display:flex; align-items:center; gap:12px; padding:14px; margin-bottom:10px; border:1px solid var(--line); border-radius:var(--radius-md); background:var(--panel); cursor:pointer; transition:transform .2s, border-color .2s; }
.row:hover { transform:translateY(-2px); border-color:rgba(166,156,255,.42); }
.row-ico { width:38px; height:38px; flex:none; display:grid; place-items:center; border-radius:11px; background:rgba(139,124,255,.12); color:var(--brand-bright); }
.row-ico svg { width:18px; height:18px; }
.row-info { flex:1; min-width:0; }
.row-title { font-weight:700; font-size:14px; line-height:1.35; }
.row-sub { color:var(--muted); font-size:12px; margin-top:2px; }
.row-arrow { color:var(--muted); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 14px; border-radius:12px; border:1px solid transparent; font-weight:700; font-size:13px; color:#fff; background:linear-gradient(135deg,#9487ff,#6c5bed); }
.btn-ghost { color:var(--text); background:var(--panel-soft); border-color:var(--line); }
.btn[disabled] { opacity:.5; cursor:not-allowed; }
.back-row { margin-bottom:12px; }
.sec-title { font-weight:700; font-size:15px; margin:0 0 12px; }
.class-card { border:1px solid var(--line); border-radius:var(--radius-md); background:var(--panel); margin-bottom:10px; padding:14px; }
.class-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.empty, .error { text-align:center; padding:36px 16px; color:var(--muted); }
.loader { width:30px; height:30px; margin:36px auto; border-radius:50%; border:3px solid var(--line-strong); border-top-color:var(--brand-bright); animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.about ul { margin:0 0 16px; padding-left:20px; color:var(--muted-bright); font-size:14px; }
.about li { margin-bottom:6px; }
/* ---- lecture progress / completion / search (from cww) ---- */
.ch-prog { display:flex; align-items:center; gap:8px; margin-top:8px; }
.ch-bar, .lv-bar { flex:1; height:5px; border-radius:999px; overflow:hidden; background:color-mix(in srgb, var(--text) 14%, transparent); }
.ch-bar i, .lv-bar i { display:block; width:0; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--brand),var(--brand-bright)); transition:width .3s ease; }
.ch-prog b { color:var(--brand-bright); font-size:11.5px; font-weight:700; font-variant-numeric:tabular-nums; min-width:32px; text-align:right; }
.lv-prog { margin:0 0 14px; padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius-md); background:var(--panel); }
.lv-prog-top { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:8px; color:var(--muted-bright); font-size:12px; font-weight:600; }
.lv-prog-top b { color:var(--brand-bright); font-weight:700; }
.lv-prog .lv-bar { height:6px; }
.lv-prog.full .lv-prog-top b { color:#34d27b; } .lv-prog.full .lv-bar i, .ch-prog.full .ch-bar i { background:#34d27b; } .ch-prog.full b { color:#34d27b; }
.search { width:100%; margin:0 0 12px; padding:11px 14px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--panel); color:var(--text); font:inherit; font-size:14px; outline:none; }
.search:focus { border-color:var(--brand-bright); }
.lec-head { display:flex; align-items:center; gap:12px; }
.lec-num { flex:none; width:34px; height:34px; display:grid; place-items:center; border-radius:10px; background:rgba(139,124,255,.12); color:var(--brand-bright); font-size:13px; font-weight:700; }
.lec-main { flex:1; min-width:0; }
.lv-chk { flex:none; width:32px; height:32px; display:grid; place-items:center; padding:0; border-radius:50%; border:1.5px solid var(--line-strong); background:transparent; color:transparent; transition:.2s; }
.lv-chk svg { width:16px; height:16px; }
.lv-chk[aria-pressed="true"] { background:#34d27b; border-color:#34d27b; color:#fff; }
.class-card.done { border-color:rgba(52,210,123,.4); }
.class-card.done .lec-num { background:rgba(52,210,123,.15); color:#34d27b; }
.class-card.flash { animation:flash 1.8s ease; }
@keyframes flash { 0%,60% { box-shadow:0 0 0 2px var(--brand-bright); } 100% { box-shadow:none; } }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
.stat { padding:12px 8px; text-align:center; border:1px solid var(--line); border-radius:var(--radius-md); background:var(--panel); }
.stat b { display:block; font:700 18px/1.2 "Space Grotesk"; color:var(--text); } .stat span { color:var(--muted); font-size:11px; }
</style>
</head>
<body>
<header class="topbar">
  <a class="icon-btn" id="backBtn" href="index.html" aria-label="Back to batches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg></a>
  <h2 id="topTitle">Loading…</h2>
</header>
<main class="wrap">
  <section class="hero" id="hero"><div class="loader"></div></section>
  <div class="tabs" id="tabs" style="display:none">
    <button class="tab active" data-tab="lectures">Lectures</button>
    <button class="tab" data-tab="notes">Notes</button>
    <button class="tab" data-tab="about">About</button>
  </div>
  <section class="panel active" id="tab-lectures"></section>
  <section class="panel" id="tab-notes"></section>
  <section class="panel about" id="tab-about"></section>
</main>


<script>
const API = "https://backend.multistreaming.site";
const $ = (s) => document.querySelector(s);
const esc = (v = "") => String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c]));
const ICON_VIDEO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>';
const ICON_FILE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
const ARROW = '<svg class="row-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 18 15 12 9 6"/></svg>';

const params = new URLSearchParams(location.search);
const batchId = params.get("id");
let lectureTopics = [], noteTopics = [];
let openLectureTopic = null, openNoteTopic = null;
let batchInfo = null, st = { tab: "lectures", s: null }, filterText = "";

/* ---------- completion + recently watched (shared with the home page) ---------- */
const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
const DONE_KEY = "cx-done", RECENT_KEY = "codex-studys-recent-lectures";
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const readDone = () => { const m = lsGet(DONE_KEY, {}); return m && typeof m === "object" && !Array.isArray(m) ? m : {}; };
const lecId = (c, ti, ci) => String(c.id ?? c._id ?? c.classId ?? (ti + "." + ci));
const lkey = (id) => batchId + "-" + id;
const isDone = (id) => !!readDone()[lkey(id)];
function setDone(id, on) {
  const m = readDone(), k = lkey(id);
  if (on) m[k] = 1; else delete m[k];
  try { localStorage.setItem(DONE_KEY, JSON.stringify(m)); } catch (e) {}
  document.querySelectorAll('[data-lk="' + CSS.escape(String(id)) + '"]').forEach((card) => {
    card.classList.toggle("done", !!on);
    const c = card.querySelector("[data-chk]");
    if (c) { c.setAttribute("aria-pressed", on ? "true" : "false"); c.setAttribute("aria-label", on ? "Mark as not complete" : "Mark as complete"); }
  });
  updateProgressDom();
}
function topicStats(ti) {
  const list = (lectureTopics[ti] && lectureTopics[ti].classes) || [];
  let done = 0; const m = readDone();
  list.forEach((c, ci) => { if (m[lkey(lecId(c, ti, ci))]) done++; });
  return { total: list.length, done };
}
function allStats() {
  let total = 0, done = 0;
  lectureTopics.forEach((t, ti) => { const s = topicStats(ti); total += s.total; done += s.done; });
  return { total, done };
}
const pctOf = (s) => s.total ? Math.round((s.done / s.total) * 100) : 0;
function progBlock(s, label) {
  const pct = pctOf(s);
  return `<div class="lv-prog${s.total && s.done >= s.total ? " full" : ""}" id="lvProg"><div class="lv-prog-top"><span id="lvProgTxt">${s.done}/${s.total} ${label}</span><b id="lvProgPct">${pct}%</b></div><div class="lv-bar"><i id="lvProgFill" style="width:${pct}%"></i></div></div>`;
}
function updateProgressDom() {
  const el = document.getElementById("lvProg");
  if (el) {
    const s = st.s !== null && st.tab === "lectures" ? topicStats(st.s) : allStats();
    const pct = pctOf(s);
    el.classList.toggle("full", s.total > 0 && s.done >= s.total);
    document.getElementById("lvProgTxt").textContent = s.done + "/" + s.total + (st.s !== null ? " lectures done" : " lectures done");
    document.getElementById("lvProgPct").textContent = pct + "%";
    document.getElementById("lvProgFill").style.width = pct + "%";
  }
  const ab = document.getElementById("statDone"); if (ab) ab.textContent = String(allStats().done);
}
function trackLecture(ti, ci) {
  try {
    const t = lectureTopics[ti], c = t && t.classes[ci]; if (!c) return;
    const th = (batchInfo && (batchInfo.banner || batchInfo.bannerSquare)) || "";
    const id = lecId(c, ti, ci);
    const arr = lsGet(RECENT_KEY, []).filter((x) => !(x && x.b === batchId && String(x.i) === id));
    arr.unshift({ b: batchId, i: id, ti, ci, t: c.title || "Lecture", bn: (batchInfo && batchInfo.title) || "", th, at: Date.now() });
    localStorage.setItem(RECENT_KEY, JSON.stringify(arr.slice(0, 10)));
  } catch (e) {}
}

/* ---------- history-aware navigation (tab + chapter in the URL hash) ---------- */
function readHash() {
  const m = location.hash.match(/tab=(lectures|notes|about)(?:&s=(\d+))?/);
  return { tab: m ? m[1] : "lectures", s: m && m[2] !== undefined ? +m[2] : null };
}
function go(tab, s) {
  st = { tab, s: s === undefined ? null : s };
  filterText = "";
  history.pushState(st, "", "#tab=" + tab + (st.s !== null ? "&s=" + st.s : ""));
  applyState(); window.scrollTo({ top: 0 });
}
function applyState() {
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x.dataset.tab === st.tab));
  document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.id === "tab-" + st.tab));
  if (st.tab === "lectures") { if (lectureTopics.length) { if (st.s !== null && lectureTopics[st.s]) renderLectures(st.s); else renderLectureTopics(); } }
  else if (st.tab === "notes") loadNotes();
}
window.addEventListener("storage", (e) => { if (e.key === DONE_KEY) { if (st.tab === "lectures" && st.s === null && lectureTopics.length) renderLectureTopics(); else updateProgressDom(); } });
window.addEventListener("popstate", (e) => {
  st = (e.state && e.state.tab) ? { tab: e.state.tab, s: e.state.s === undefined ? null : e.state.s } : readHash();
  filterText = ""; applyState();
});
$("#backBtn").addEventListener("click", (e) => {
  if (st.s !== null && st.tab !== "about") { e.preventDefault(); if (history.length > 1) history.back(); else go(st.tab); }
});

async function getJson(path) {
  const res = await fetch(API + path);
  if (!res.ok) throw new Error("Request failed (" + res.status + ")");
  const json = await res.json();
  if (json.state !== 200) throw new Error(json.message || "Request failed");
  return json.data;
}

async function init() {
  if (!batchId) { $("#hero").innerHTML = '<div class="error">Batch not found.</div>'; return; }
  try {
    const b = await getJson("/api/courses/" + encodeURIComponent(batchId));
    batchInfo = b;
    document.title = (b.title || "Batch") + " — CODEX STUDYS";
    $("#topTitle").textContent = b.title || "Batch";
    $("#hero").innerHTML = `
      <img src="${esc(b.banner || b.bannerSquare || "assets/codex-telegram.png")}" alt="" referrerpolicy="no-referrer" onerror="this.src='assets/codex-telegram.png'">
      <div class="hero-body">
        <h1>${esc(b.title)}</h1>
        ${b.short_description ? `<p>${esc(b.short_description)}</p>` : ""}
        <div class="chips">
          ${b.isLive ? '<span class="chip chip-live">● LIVE</span>' : ""}
          ${b.isRecorded ? '<span class="chip chip-accent">Recorded</span>' : ""}
          ${b.validity ? `<span class="chip">${esc(b.validity)}</span>` : ""}
        </div>
      </div>`;
    renderAbout(b);
    $("#tabs").style.display = "flex";
    st = readHash(); history.replaceState(st, "");
    await loadLectures();
    openDeepLink();
  } catch (e) {
    $("#hero").innerHTML = `<div class="error">Could not load this batch.<br><small>${esc(e.message)}</small></div>`;
  }
}

function renderAbout(b) {
  let h = "";
  if ((b.description || []).length) h += `<h3 class="sec-title">About this batch</h3><ul>${b.description.map((d) => `<li>${esc(d)}</li>`).join("")}</ul>`;
  if ((b.courseHighlights || []).length) h += `<h3 class="sec-title">Highlights</h3><ul>${b.courseHighlights.map((d) => `<li>${esc(d)}</li>`).join("")}</ul>`;
  if ((b.timeTable || []).length) h += `<h3 class="sec-title">Timetable</h3><ul>${b.timeTable.map((t) => `<li>${esc(t.topic)} — ${esc(t.time)}</li>`).join("")}</ul>`;
  $("#tab-about").innerHTML = '<div class="stats" id="aboutStats"></div>' + (h || '<div class="empty">No details available.</div>');
}

/* ---------- Lectures ---------- */
async function loadLectures() {
  const el = $("#tab-lectures");
  el.innerHTML = '<div class="loader"></div>';
  try {
    const data = await getJson(`/api/courses/${encodeURIComponent(batchId)}/classes?populate=full`);
    lectureTopics = (data.classes || []).filter((t) => (t.classes || []).length);
    renderAboutStats();
    applyState(); if (st.tab !== "lectures") renderLectureTopics();
  } catch (e) { el.innerHTML = '<div class="error">Failed to load lectures.</div>'; }
}

function renderAboutStats() {
  const el = document.getElementById("aboutStats"); if (!el) return;
  const s = allStats();
  el.innerHTML = `<div class="stat"><b>${s.total}</b><span>Lectures</span></div><div class="stat"><b id="statDone">${s.done}</b><span>Completed</span></div><div class="stat"><b>${lectureTopics.length}</b><span>Subjects</span></div>`;
}

function renderLectureTopics() {
  openLectureTopic = null;
  const el = $("#tab-lectures");
  if (!lectureTopics.length) { el.innerHTML = '<div class="empty">No lectures uploaded yet. Please check back later.</div>'; return; }
  el.innerHTML = progBlock(allStats(), "lectures done") + lectureTopics.map((t, i) => {
    const s = topicStats(i), pct = pctOf(s);
    return `
    <div class="row" data-topic="${i}">
      <div class="row-ico">${ICON_VIDEO}</div>
      <div class="row-info"><div class="row-title">${esc(t.topicName)}</div><div class="row-sub">${t.classes.length} lecture${t.classes.length === 1 ? "" : "s"}</div>
        <div class="ch-prog${s.total && s.done >= s.total ? " full" : ""}"><span class="ch-bar"><i style="width:${pct}%"></i></span><b>${pct}%</b></div></div>${ARROW}
    </div>`; }).join("");
  el.querySelectorAll(".row").forEach((r) => r.addEventListener("click", () => go("lectures", Number(r.dataset.topic))));
  updateProgressDom();
}

function classSources(cls) {
  const rank = (q) => { const n = parseInt(String(q || "").replace(/[^0-9]/g, ""), 10); return isNaN(n) ? 0 : n; };
  return (cls.mp4Recordings || []).filter((r) => r && r.url).sort((a, b) => rank(b.quality) - rank(a.quality));
}

function renderLectures(i) {
  openLectureTopic = i;
  st = { tab: "lectures", s: i };
  const t = lectureTopics[i];
  const el = $("#tab-lectures");
  el.innerHTML = `<div class="back-row"><button class="btn btn-ghost" id="lecBack">← Back</button></div><h3 class="sec-title">${esc(t.topicName)}</h3>` +
    progBlock(topicStats(i), "lectures done") +
    (t.classes.length > 10 ? `<input class="search" id="lecSearch" type="search" placeholder="Search in ${esc(t.topicName)}…" autocomplete="off" value="${esc(filterText)}">` : "") +
    '<div id="lecList"></div>';
  const draw = () => {
    const q = filterText.trim().toLowerCase(), m = readDone();
    const rows = t.classes.map((c, ci) => [c, ci]).filter(([c]) => !q || String(c.title || "").toLowerCase().includes(q));
    $("#lecList").innerHTML = rows.length ? rows.map(([c, ci]) => lectureCard(c, i, ci, m)).join("") : '<div class="empty">No results found.</div>';
  };
  const s = $("#lecSearch"); if (s) s.addEventListener("input", () => { filterText = s.value; draw(); });
  draw();
  $("#lecBack").addEventListener("click", () => { if (history.length > 1 && history.state && history.state.s != null) history.back(); else go("lectures"); });
}

function lectureCard(c, ti, ci, m) {
  const id = lecId(c, ti, ci), done = !!m[lkey(id)];
  const srcs = classSources(c);
  const date = c.startDate ? new Date(c.startDate).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) : "";
  const tr = ` data-track="${ti}.${ci}"`;
  let watch = "";
  if (srcs.length > 1) watch = srcs.map((r) => `<button class="btn" data-open="${esc(r.url)}"${tr}>▶ ${esc(r.quality || "Watch")}</button>`).join("");
  else if (srcs.length === 1) watch = `<button class="btn" data-open="${esc(srcs[0].url)}"${tr}>▶ Watch Recording</button>`;
  else if (c.class_link) watch = `<button class="btn" data-open="${esc(c.class_link)}"${tr}>▶ Watch Recording</button>`;
  else watch = '<button class="btn" disabled>Recording soon</button>';
  const notes = (c.classPdf || []).map((p, pi) => `
    <button class="btn btn-ghost" data-open="${esc(p.url)}">📄 Notes</button>
    <button class="btn btn-ghost" data-dl="${esc(p.url)}" data-name="${esc((c.title || "notes") + ((c.classPdf || []).length > 1 ? " " + (pi + 1) : ""))}">⬇ Download</button>`).join("");
  return `<div class="class-card${done ? " done" : ""}" data-lk="${esc(id)}">
    <div class="lec-head"><span class="lec-num">${ci + 1}</span>
      <div class="lec-main"><div class="row-title">${esc(c.title)}</div><div class="row-sub">${[c.teacherName, date].filter(Boolean).map(esc).join(" · ")}</div></div>
      <button class="lv-chk" type="button" data-chk="${esc(id)}" aria-pressed="${done ? "true" : "false"}" aria-label="${done ? "Mark as not complete" : "Mark as complete"}">${TICK}</button></div>
    <div class="class-actions">${watch}${notes}</div>
  </div>`;
}

/* open a lecture from the home page "Recently Watched" card */
function openDeepLink() {
  const m = location.hash.match(/[#&]lec=([^&]+)/); if (!m) return;
  const key = decodeURIComponent(m[1]);
  let ti = -1, ci = -1;
  lectureTopics.forEach((t, a) => t.classes.forEach((c, b) => { if (ti < 0 && lecId(c, a, b) === key) { ti = a; ci = b; } }));
  history.replaceState(st, "", "#tab=lectures");
  if (ti < 0) return;
  st = { tab: "lectures", s: ti };
  history.replaceState(st, "", "#tab=lectures&s=" + ti);
  applyState();
  const card = document.querySelector('[data-lk="' + CSS.escape(key) + '"]');
  if (card) { card.scrollIntoView({ block: "center" }); card.classList.add("flash"); }
}

/* ---------- Notes ---------- */
async function loadNotes() {
  const el = $("#tab-notes");
  if (noteTopics.length) return renderNotesView();
  el.innerHTML = '<div class="loader"></div>';
  try {
    const data = await getJson(`/api/courses/${encodeURIComponent(batchId)}/pdfs?groupBy=topic`);
    noteTopics = (data.topics || []).filter((t) => (t.pdfs || []).length);
    renderNotesView();
  } catch (e) { el.innerHTML = '<div class="error">Failed to load notes.</div>'; }
}

function renderNotesView() { if (st.tab === "notes" && st.s !== null && noteTopics[st.s]) renderNotes(st.s); else renderNoteTopics(); }

function renderNoteTopics() {
  const el = $("#tab-notes");
  if (!noteTopics.length) { el.innerHTML = '<div class="empty">No notes uploaded yet.</div>'; return; }
  el.innerHTML = noteTopics.map((t, i) => `
    <div class="row" data-topic="${i}">
      <div class="row-ico">${ICON_FILE}</div>
      <div class="row-info"><div class="row-title">${esc(t.topicName)}</div><div class="row-sub">${t.pdfs.length} PDF${t.pdfs.length === 1 ? "" : "s"}</div></div>${ARROW}
    </div>`).join("");
  el.querySelectorAll(".row").forEach((r) => r.addEventListener("click", () => go("notes", Number(r.dataset.topic))));
}

function renderNotes(i) {
  const t = noteTopics[i];
  const el = $("#tab-notes");
  el.innerHTML = `<div class="back-row"><button class="btn btn-ghost" id="noteBack">← Back</button></div><h3 class="sec-title">${esc(t.topicName)}</h3>` +
    t.pdfs.map((p) => `<div class="class-card"><div class="row-title">${esc(p.title)}</div>${p.teacherName ? `<div class="row-sub">By ${esc(p.teacherName)}</div>` : ""}
      <div class="class-actions"><button class="btn" data-open="${esc(p.uploadPdf)}">View PDF</button><button class="btn btn-ghost" data-dl="${esc(p.uploadPdf)}" data-name="${esc(p.title)}">⬇ Download</button></div></div>`).join("");
  $("#noteBack").addEventListener("click", () => { if (history.length > 1 && history.state && history.state.s != null) history.back(); else go("notes"); });
  window.scrollTo({ top: 0 });
}

/* ---------- Tabs ---------- */
document.querySelectorAll(".tab").forEach((tab) => tab.addEventListener("click", () => { if (tab.dataset.tab !== st.tab) go(tab.dataset.tab); }));

/* ---------- Open / download (same behaviour as the Selection Way site) ---------- */
function openLink(url) { if (url) window.open(url, "_blank", "noopener,noreferrer"); }

async function downloadFile(url, name) {
  const safe = (String(name || "notes").replace(/[\\/:*?"<>|]+/g, " ").trim() || "notes") + ".pdf";
  try {
    const res = await fetch(url, { referrerPolicy: "no-referrer" });
    if (!res.ok) throw new Error("bad response");
    const blob = await res.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = safe;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) {
    // host blocks direct download -> open the file so it can be saved from the viewer
    const a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.download = safe;
    document.body.appendChild(a); a.click(); a.remove();
  }
}

document.addEventListener("click", (e) => {
  const c = e.target.closest("[data-chk]"); if (c) { const id = c.dataset.chk; setDone(id, !isDone(id)); return; }
  const o = e.target.closest("[data-open]");
  if (o) {
    if (o.dataset.track) { const [ti, ci] = o.dataset.track.split(".").map(Number); trackLecture(ti, ci); }
    openLink(o.dataset.open); return;
  }
  const d = e.target.closest("[data-dl]"); if (d) { downloadFile(d.dataset.dl, d.dataset.name); }
});

init();
</script>
